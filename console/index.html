<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/online.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>cici的工作台</title>
    <style>
      .cici-boot {
        align-items: center;
        background: #f7f7f5;
        color: #1f1f1f;
        display: flex;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        inset: 0;
        justify-content: center;
        position: fixed;
      }
      .cici-boot__content {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .cici-boot__logo {
        height: 68px;
        object-fit: contain;
        width: 68px;
      }
      .cici-boot__label {
        color: #70706c;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      @media (prefers-color-scheme: dark) {
        .cici-boot {
          background: #141414;
          color: #f4f4f1;
        }
        .cici-boot__label {
          color: #a6a6a0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="cici-boot" role="status" aria-live="polite">
        <div class="cici-boot__content">
          <img class="cici-boot__logo" src="/logo-light.png" alt="cici的工作台" />
          <span class="cici-boot__label">cici的工作台</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
